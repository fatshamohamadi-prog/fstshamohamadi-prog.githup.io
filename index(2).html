<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fatemeh Shahmohammadi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f8;--surface:#fff;--ink:#1b2636;--mute:#58667a;--navy:#1f3a5f;--hero:#1f3a5f;--heroink:#fff;--gold:#c9952b;--line:#d5dde9;--dot:#c9952b;--dot-off:#c9d3e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1824;--surface:#172536;--ink:#e8eef7;--mute:#9fb0c6;--navy:#9db8de;--hero:#14233a;--gold:#e3b85a;--line:#2a3c54;--dot:#e3b85a;--dot-off:#33465f}}
:root[data-theme="dark"]{--bg:#0f1824;--surface:#172536;--ink:#e8eef7;--mute:#9fb0c6;--navy:#9db8de;--hero:#14233a;--gold:#e3b85a;--line:#2a3c54;--dot:#e3b85a;--dot-off:#33465f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.8 "Vazirmatn",Tahoma,system-ui,sans-serif}
header{background:var(--hero);color:var(--heroink);padding:36px 20px 28px}
.wrap{max-width:1000px;margin:0 auto}
.top{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.top img{width:130px;height:130px;border-radius:50%;border:3px solid var(--gold);object-fit:cover}
h1{margin:0;font-size:clamp(28px,6vw,42px);font-weight:800;line-height:1.3}
.role{margin:4px 0 0;font-size:19px;opacity:.85}
nav{margin-top:22px;display:flex;gap:8px}
nav a{padding:4px 16px;border:1px solid rgba(255,255,255,.35);border-radius:99px;color:inherit;text-decoration:none;font-size:15px}
nav a[aria-current="true"]{background:var(--gold);border-color:var(--gold);color:#1b1b1b;font-weight:700}
nav a:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main.wrap{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;padding:24px 16px 48px}
@media (max-width:760px){main.wrap{grid-template-columns:1fr}}
section{background:var(--surface);border-radius:10px;padding:20px 22px;margin-bottom:20px}
h2{margin:0 0 12px;font-size:20px;font-weight:800;color:var(--navy);padding-bottom:6px;border-bottom:2px solid var(--gold);display:inline-block}
h3{margin:18px 0 0;font-size:17px;font-weight:700;line-height:1.6}
.sub{color:var(--mute);font-size:15px;margin:0}
.date{color:var(--gold);font-weight:700;font-size:15px;margin:0}
ul{margin:6px 0 0;padding-inline-start:20px}
li{margin:2px 0}
li::marker{color:var(--gold)}
.job{border-inline-start:3px solid var(--line);padding-inline-start:14px;margin-top:16px}
.job h3{margin-top:0}
.lang{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
.dots{display:flex;gap:4px;direction:ltr}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--dot-off)}
.dots i.on{background:var(--dot)}
.k{display:block;font-weight:700;color:var(--navy);margin-top:10px;font-size:15px}
a{color:var(--navy);overflow-wrap:anywhere}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;text-align:start}
.code{font-weight:700;direction:ltr;unicode-bidi:isolate;display:inline-block}
</style>
</head>
